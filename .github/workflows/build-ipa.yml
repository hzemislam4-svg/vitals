name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare .env for bundling
        run: |
          echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_}" >> .env
          echo "EXPO_PUBLIC_REVENUECAT_API_KEY_TEST=${EXPO_PUBLIC_REVENUECAT_API_KEY_TEST:-test_}" >> .env
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_REVENUECAT_API_KEY_TEST: ${{ secrets.EXPO_PUBLIC_REVENUECAT_API_KEY_TEST }}

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build app unsigned for device
        run: |
          cd ios
          xcodebuild \
            -workspace Vitals.xcworkspace \
            -scheme Vitals \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Vitals.app Payload/
          zip -r Vitals.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Vitals-ipa
          path: Vitals.ipa
          if-no-files-found: error
